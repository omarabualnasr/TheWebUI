<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Button Playground</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 40px;
      background-color: #FFFFFF;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .container {
      display: block;
      position: relative;
      height: 18px;
      padding-left: 30px;
      cursor: pointer;
      font-size: 15px;
      color: #242424;
      line-height: 18px;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .container input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }

    .checkmark {
      position: absolute;
      top: 0;
      left: 0;
      height: 18px;
      width: 18px;
      background-color: #EDEDED;
      border: 1px solid #858585;
      border-radius: 50%;
      box-sizing: border-box;
      transition: background-color 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .checkmark:after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #FFFFFF;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.2s ease;
    }

    .container:hover input:not(:checked) ~ .checkmark {
      background-color: #E4E4E4;
      border-color: #858585;
    }

    .container:active input:not(:checked) ~ .checkmark {
      background-color: #D6D6D6;
      border-color: #D6D6D6;
    }

    .container:active input:not(:checked) ~ .checkmark:after {
      transform: translate(-50%, -50%) scale(0.4);
      opacity: 1;
    }

    .container input:checked ~ .checkmark {
      background-color: #242424;
      border-color: #242424;
    }

    .container input:checked ~ .checkmark:after {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .container:hover input:checked ~ .checkmark {
      background-color: #404040;
      border-color: #404040;
    }

    .container:active input:checked ~ .checkmark {
      background-color: #595959;
      border-color: #595959;
    }

    .container:active input:checked ~ .checkmark:after {
      transform: translate(-50%, -50%) scale(0.4);
    }
  </style>
</head>
<body>
  <div class="radio-group">
    <label class="container">
      <input type="radio" name="group-small" checked="checked">
      <span class="checkmark"></span>
    </label>

    <label class="container">
      <input type="radio" name="group-small">
      <span class="checkmark"></span>
    </label>
  </div>
</body>
</html>
